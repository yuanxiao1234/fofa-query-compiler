[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fofa-query-compiler"
version = "0.1.0"
description = "Local, auditable natural-language to FOFA query compiler"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.9,<3",
  "pyyaml>=6.0,<7",
  "python-multipart>=0.0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "hypothesis>=6.112,<7",
  "mypy>=1.11,<2",
  "playwright>=1.55,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
fofa-compiler = "fofa_compiler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fofa_compiler"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["fofa_compiler"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.coverage.run]
branch = true
source = ["fofa_compiler"]
