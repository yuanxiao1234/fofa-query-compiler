<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>题目队列</title><link rel="stylesheet" href="/static/app.css"></head><body><main><h1>题目队列</h1><label>筛选<input data-filter placeholder="题号"></label><ul>{% for item in items %}<li data-question="{{ item.question_id }}"><a href="/questions/{{ item.question_id }}">{{ item.question_id }}</a> · {{ item.risk }} · {% if item.confirmed %}已确认{% else %}待确认{% endif %}</li>{% endfor %}</ul></main><script src="/static/app.js"></script></body></html>
